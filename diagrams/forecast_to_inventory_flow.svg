<svg width="1000" height="170" viewBox="0 0 1000 170" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Forecast to inventory decision flow</title>
<desc>A single sequential chain: forecast feeds uncertainty estimation, which sizes safety stock, which sets the reorder point, which feeds the LP allocation, which is checked against realized cost.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#2E6690" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g font-family="Helvetica, Arial, sans-serif">

<rect x="20" y="50" width="145" height="70" rx="6" fill="#E7F1FB" stroke="#4F8FC7" stroke-width="1.5"/>
<text x="92" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4E77">Forecast</text>
<text x="92" y="98" text-anchor="middle" font-size="12" fill="#2E6690">Expected demand</text>

<rect x="181" y="50" width="145" height="70" rx="6" fill="#E7F1FB" stroke="#4F8FC7" stroke-width="1.5"/>
<text x="253" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4E77">Uncertainty</text>
<text x="253" y="98" text-anchor="middle" font-size="12" fill="#2E6690">Error spread (&#963;)</text>

<rect x="342" y="50" width="145" height="70" rx="6" fill="#E7F1FB" stroke="#4F8FC7" stroke-width="1.5"/>
<text x="414" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4E77">Safety stock</text>
<text x="414" y="98" text-anchor="middle" font-size="12" fill="#2E6690">Buffer stock</text>

<rect x="503" y="50" width="145" height="70" rx="6" fill="#E7F1FB" stroke="#4F8FC7" stroke-width="1.5"/>
<text x="575" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4E77">Reorder point</text>
<text x="575" y="98" text-anchor="middle" font-size="12" fill="#2E6690">Order trigger</text>

<rect x="664" y="50" width="145" height="70" rx="6" fill="#FDF3E3" stroke="#D9A441" stroke-width="1.5"/>
<text x="736" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#7A5510">Allocation</text>
<text x="736" y="98" text-anchor="middle" font-size="12" fill="#8C6A1E">Constrained LP</text>

<rect x="825" y="50" width="145" height="70" rx="6" fill="#E4F5EF" stroke="#46A883" stroke-width="1.5"/>
<text x="897" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#14513C">Realized cost</text>
<text x="897" y="98" text-anchor="middle" font-size="12" fill="#1F6B4E">vs naive baseline</text>

<line x1="165" y1="85" x2="179" y2="85" stroke="#2E6690" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="326" y1="85" x2="340" y2="85" stroke="#2E6690" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="487" y1="85" x2="501" y2="85" stroke="#2E6690" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="648" y1="85" x2="662" y2="85" stroke="#2E6690" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="809" y1="85" x2="823" y2="85" stroke="#2E6690" stroke-width="1.5" marker-end="url(#arrow2)"/>

</g>
</svg>
